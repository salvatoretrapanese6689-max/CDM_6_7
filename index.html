if(SIM.acts>2500){G=null;R.ab++;continue}
if(G.ask)botAsk();else{SIM.acts++;botMove()}}
const e=document.getElementById('simp');if(e)e.textContent='Partita '+R.g+' di '+R.target+' \u00b7 '+Math.round((Date.now()-R.t0)/1000)+' s';

function simDone(){const R=SIMV.res;SIM=null;G=null;HIST=[];SIMV.run=false;SIMV.stop=false;if(R&&!R.g)SIMV.res=null;else if(R)R.sec=Math.round((Date.now()-R.t0)/1000);render()}
function simRound(R){const n=R.n,d=G.pl.map((p,i)=>p.s-G.rs[i]),st=SIM.st,tot=d.reduce((a,b)=>a+b,0);R.rn++;R.stD+=d[st];R.otD+=(tot-d[st])/(n-1);if(G.sum.c>=0)R.cl++;else R.bl++}
function simGameEnd(R){const n=R.n,sc=G.pl.map(p=>p.s),mx=Math.max(...sc),w=[];sc.forEach((s,i)=>{if(s===mx)w.push(i)});
R.g++;R.mv+=SIM.acts;R.dr+=SIM.dr;R.ps+=SIM.ps;w.forEach(i=>{R.win[i]+=1/w.length});sc.forEach((s,i)=>{R.sc[i]+=s});
const so=[...sc].sort((a,b)=>b-a);R.margin+=so[0]-so[1];R.nW+=w.length;R.nL+=n-w.length;
G.tot.forEach((o,i)=>{const T=w.includes(i)?R.orgW:R.orgL;for(const k in o){R.org[k]=(R.org[k]||0)+o[k];T[k]=(T[k]||0)+o[k]}});
const lk=G.tot.map(o=>(o.q||0)+(o.s||0)),ml=Math.max(...lk),lt=[];lk.forEach((v,i)=>{if(v===ml)lt.push(i)});
if(lt.length===1){R.lkN++;if(w.includes(lt[0]))R.lkW+=1/w.length}}
function simStats(R){const g=R.g,n=R.n,pg=g*n,sc=R.sc.reduce((a,b)=>a+b,0)/pg,caso=((R.org.q||0)+(R.org.s||0))/pg;
return{g,n,sc,caso,casoP:sc>0?100*caso/sc:0,first:R.rn?(R.stD-R.otD)/R.rn:0,lk:R.lkN?100*R.lkW/R.lkN:0,base:100/n,mvg:R.mv/g,drg:R.dr/g,psg:R.ps/g,clP:R.cl+R.bl?100*R.cl/(R.cl+R.bl):0,margin:R.margin/g,
rows:ORG.filter(([k])=>R.org[k]).map(([k,l])=>({k,l,a:R.org[k]/pg,w:R.nW?(R.orgW[k]||0)/R.nW:0,o:R.nL?(R.orgL[k]||0)/R.nL:0})),
seats:R.win.map((w,i)=>({i,lv:R.lv[i],w:100*w/g,e:simZ(w/g,g),s:R.sc[i]/g})),
mixed:new Set(R.lv).size>1,
lvr:[...new Set(R.lv)].sort((a,b)=>a-b).map(l=>{const ix=R.lv.map((x,i)=>x===l?i:-1).filter(i=>i>=0),c=ix.length,p=ix.reduce((a,i)=>a+R.win[i],0)/(g*c);return{l,c,w:100*p,e:simZ(p,g*c),s:ix.reduce((a,i)=>a+R.sc[i],0)/(g*c)}})}}
const simZ=(p,m)=>1.96*Math.sqrt(p*(1-p)/m)*100;
const simLvT=R=>new Set(R.lv).size===1?LV[R.lv[0]]:R.lv.map(l=>LV[l]).join(', ');

const TRACKS={menu:['musica-menu-1.m4a'],game:['musica-gioco-1.m4a','musica-gioco-2.m4a','musica-gioco-3.m4a','musica-gioco-4.m4a','musica-gioco-5.m4a']};
let Q=[],LAST=-1;
function nextIdx(l){if(l.length===1)return 0;if(!Q.length){Q=l.map((_,i)=>i);for(let i=Q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[Q[i],Q[j]]=[Q[j],Q[i]]}if(Q[Q.length-1]===LAST){[Q[0],Q[Q.length-1]]=[Q[Q.length-1],Q[0]]}}LAST=Q.pop();return LAST}let ACTX='';

const TRC={};let REAL=false;
function trk(u){return TRC[u]||(TRC[u]=fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>URL.createObjectURL(new Blob([b],{type:'audio/mp4'}))).catch(e=>{delete TRC[u];throw e}))}
function loadTrk(u,cx){trk(u).then(o=>{if(!AUD||ACTX!==cx)return;AUD.src=o;REAL=true;if(!MUTED){const p=AUD.play();if(p&&p.then)p.then(()=>{AUDOK=true}).catch(()=>{})}}).catch(()=>{})}

if(ACTX!==cx){ACTX=cx;Q=[];LAST=-1;REAL=false;AUD.src=SIL;const p0=AUD.play();if(p0&&p0.then)p0.then(()=>{AUDOK=true}).catch(()=>{});loadTrk(L[nextIdx(L)],cx);return}
const pr=AUD.play();if(pr&&pr.then)pr.then(()=>{AUDOK=true}).catch(()=>{})}
let AUDOK=false;

function unlockAudio(){if(AUDOK)return;music()}
['click','touchend','keydown'].forEach(e=>document.addEventListener(e,unlockAudio,{capture:true,passive:true}));

const lb=lbr.map((x,j)=>`<div><span class=rk>${j+1}\u00b0</span><i style='background:${PC[x[0]]}'></i><b>${sn(x[0])}</b><span>${x[1]}</span>${j?`<span class=rd>\u2212${lbr[0][1]-x[1]}</span>`:'<span></span>'}</div>`).join('');

A.innerHTML=`${conf}<div class=cmp>${top}${crow}<div style="width:clamp(260px,calc(100vh - 330px),100%);margin:2px auto">${gr.outerHTML}</div>${info}<div class=hr>${hand}</div>${bar}</div>${(bnr||ask||sum)?`<div class=sheet>${bnr}${ask}${sum}</div>`:''}`}
